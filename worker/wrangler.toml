name = "logic-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# 시크릿 설정 방법:
# wrangler secret put OPENAI_API_KEY
# wrangler secret put DASHBOARD_TOKEN
# wrangler secret put TA_TOKEN        (선택: 조교용)
# wrangler secret put ADMIN_TOKEN     (선택: 운영자용)

# KV 네임스페이스 생성 방법:
# wrangler kv:namespace create SUBMISSIONS
# → 출력된 id와 preview_id를 아래에 입력
[[kv_namespaces]]
binding = "SUBMISSIONS"
id = "606ddab048194cae940989a573aa3282"
preview_id = "ca9108165bb94029b7e515667059fe60"
