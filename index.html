<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>디지털 논리회로 인터랙티브 교재</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/content.css" />
  <link rel="stylesheet" href="css/chatbot.css" />
  <link rel="stylesheet" href="css/modal.css" />
</head>
<!-- 테마 초기화: FOUC 방지를 위해 body보다 먼저 실행 -->
<script>
  (function() {
    const saved = localStorage.getItem('theme');
    if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
<body>

  <!-- ─── 헤더 ─── -->
  <header id="app-header">
    <button id="sidebar-toggle" aria-label="목차 열기/닫기">☰</button>
    <div id="header-title">
      <h1>경북대학교 정보컴퓨터교육과 디지털 논리회로</h1>
      <span id="chapter-indicator">제01장. 들어가기</span>
    </div>
    <button id="theme-toggle" aria-label="테마 전환" title="라이트/다크 모드 전환" style="background:none;border:1px solid var(--border);color:var(--text-secondary);width:34px;height:34px;border-radius:var(--radius-sm);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:var(--transition);flex-shrink:0;">
      <svg id="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:block"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button id="chatbot-toggle" aria-label="챗봇 열기/닫기" title="AI 튜터">💬</button>
    <div id="auth-user" class="auth-user">
      <span id="auth-student-label" class="auth-student-label"></span>
      <button id="auth-change-pw" class="auth-change-pw" type="button" title="비밀번호 변경">🔑</button>
      <button id="auth-logout" class="auth-logout" type="button">로그아웃</button>
    </div>
  </header>

  <!-- ─── 본문 3분할 ─── -->
  <div id="app-body">

    <!-- 패널 1: 목차 사이드바 -->
    <nav id="sidebar">
      <div id="sidebar-header">
        <span>목차</span>
      </div>
      <ul id="toc-list">
        <!-- JS에서 동적 생성 -->
      </ul>
    </nav>

    <!-- 패널 2: 인터랙티브 콘텐츠 -->
    <main id="content-area">
      <div id="content-inner">
        <!-- chapter01.js에서 동적 렌더링 -->
        <div id="loading-screen">
          <div class="spinner"></div>
          <p>콘텐츠를 불러오는 중...</p>
        </div>
      </div>
    </main>

    <!-- 패널 3: AI 챗봇 -->
    <aside id="chatbot-panel">
      <div id="chatbot-header">
        <span class="chatbot-icon">🤖</span>
        <div>
          <div id="chatbot-title">AI 튜터</div>
          <div id="chatbot-subtitle">형성평가 진행 중</div>
        </div>
        <div id="assessment-badge" class="badge badge-pending">대기 중</div>
      </div>

      <div id="chat-messages" role="log" aria-live="polite">
        <!-- 말풍선 -->
      </div>

      <div id="chat-input-area">
        <textarea
          id="chat-input"
          placeholder="답변을 입력하세요... (Shift+Enter: 줄바꿈, Enter: 전송)"
          rows="3"
          aria-label="챗봇 입력"
        ></textarea>
        <button id="chat-send" aria-label="전송">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>

      <button id="btn-submit-pdf" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
          <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
        </svg>
        형성평가 제출
      </button>
    </aside>
  </div>

  <!-- ─── 학생 정보 입력 모달 ─── -->
  <div id="login-gate" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <div class="modal-box auth-modal-box">
      <h2 id="login-title" class="auth-modal-title">디지털 논리회로</h2>

      <!-- 탭 전환 -->
      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" id="tab-login" role="tab" aria-selected="true" type="button">로그인</button>
        <button class="auth-tab" id="tab-signup" role="tab" aria-selected="false" type="button">회원가입</button>
      </div>

      <!-- 로그인 패널 -->
      <div id="panel-login" class="auth-panel">
        <div class="form-group">
          <label for="login-student-id">학번</label>
          <input type="text" id="login-student-id" placeholder="2024XXXXXX" inputmode="numeric" autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="login-password">비밀번호</label>
          <input type="password" id="login-password" placeholder="8자 이상" autocomplete="current-password" />
        </div>
        <p id="login-error" class="login-error hidden"></p>
        <button id="login-submit" class="btn-primary btn-full" type="button">로그인</button>
        <p class="auth-switch-hint">계정이 없으신가요? <button class="auth-link" id="goto-signup" type="button">회원가입</button></p>
      </div>

      <!-- 회원가입 패널 -->
      <div id="panel-signup" class="auth-panel hidden">
        <div class="form-group">
          <label for="login-name">이름</label>
          <input type="text" id="login-name" placeholder="홍길동" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="signup-student-id">학번</label>
          <input type="text" id="signup-student-id" placeholder="2024XXXXXX" inputmode="numeric" autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="login-email">이메일</label>
          <input type="email" id="login-email" placeholder="student@knu.ac.kr" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="signup-password">비밀번호</label>
          <input type="password" id="signup-password" placeholder="8자 이상" autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label for="login-password-confirm">비밀번호 확인</label>
          <input type="password" id="login-password-confirm" placeholder="비밀번호 다시 입력" autocomplete="new-password" />
        </div>
        <p id="signup-error" class="login-error hidden"></p>
        <button id="signup-submit" class="btn-primary btn-full" type="button">회원가입</button>
        <p class="auth-switch-hint">이미 계정이 있으신가요? <button class="auth-link" id="goto-login" type="button">로그인</button></p>
      </div>
    </div>
  </div>

  <div id="student-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <h2 id="modal-title">형성평가 제출</h2>
      <p class="modal-desc">아래 정보로 제출합니다.</p>
      <div class="modal-profile-info">
        <span id="modal-profile-display" class="modal-profile-name"></span>
      </div>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-secondary">취소</button>
        <button id="modal-confirm" class="btn-primary">제출</button>
      </div>
    </div>
  </div>

  <!-- ─── 비밀번호 변경 모달 ─── -->
  <div id="change-pw-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="change-pw-title">
    <div class="modal-box">
      <h2 id="change-pw-title">비밀번호 변경</h2>
      <div class="form-group">
        <label for="change-pw-current">현재 비밀번호</label>
        <input type="password" id="change-pw-current" placeholder="현재 비밀번호" autocomplete="current-password" />
      </div>
      <div class="form-group">
        <label for="change-pw-new">새 비밀번호</label>
        <input type="password" id="change-pw-new" placeholder="8자 이상" autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label for="change-pw-confirm">새 비밀번호 확인</label>
        <input type="password" id="change-pw-confirm" placeholder="새 비밀번호 다시 입력" autocomplete="new-password" />
      </div>
      <p id="change-pw-error" class="login-error hidden"></p>
      <div class="modal-actions">
        <button id="change-pw-cancel" class="btn-secondary" type="button">취소</button>
        <button id="change-pw-submit" class="btn-primary" type="button">변경</button>
      </div>
    </div>
  </div>

  <!-- ─── 로딩 오버레이 (AI 피드백 생성 중) ─── -->
  <div id="loading-overlay" class="modal-overlay hidden">
    <div class="modal-box loading-box">
      <div class="spinner large"></div>
      <p id="loading-message">AI가 피드백을 생성 중입니다...</p>
      <p class="loading-sub">잠시만 기다려주세요 (10~20초 소요)</p>
    </div>
  </div>

  <!-- ─── 모바일 패널 백드롭 (iOS "바깥 탭해서 닫기" 지원) ─── -->
  <div id="panel-backdrop" aria-hidden="true"></div>

  <!-- ─── PDF 출력용 숨겨진 컨테이너 ─── -->
  <div id="pdf-export-container" aria-hidden="true"></div>

  <!-- ─── 성찰일지 모달 ─── -->
  <div id="reflection-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="reflection-modal-title">
    <div class="modal-box reflection-modal-box">
      <div class="reflection-modal-header">
        <h2 id="reflection-modal-title">성찰일지</h2>
        <button id="reflection-modal-close" aria-label="닫기">✕</button>
      </div>
      <div class="reflection-modal-body">
        <div class="reflection-q-block">
          <label class="reflection-q-label">1. 이번 단원에서 가장 중요하다고 생각하는 개념을 설명해 보세요.</label>
          <textarea id="reflection-a1" class="reflection-textarea" rows="4" placeholder="답변을 입력하세요..."></textarea>
        </div>
        <div class="reflection-q-block">
          <label class="reflection-q-label">2. 이번 단원에서 어려웠던 개념을 쓰고, 이유를 설명해 보세요.</label>
          <textarea id="reflection-a2" class="reflection-textarea" rows="4" placeholder="답변을 입력하세요..."></textarea>
        </div>
        <div class="reflection-q-block">
          <label class="reflection-q-label">3. 이번 단원에서 배운 내용이 이전에 공부했던 지식과 어떻게 연결되는지 작성해 보세요.</label>
          <textarea id="reflection-a3" class="reflection-textarea" rows="4" placeholder="답변을 입력하세요..."></textarea>
        </div>
      </div>
      <div class="reflection-modal-footer">
        <span id="reflection-saved-at" class="reflection-saved-at"></span>
        <div class="modal-actions">
          <button id="reflection-modal-cancel" class="btn-secondary" type="button">닫기</button>
          <button id="reflection-modal-save" class="btn-primary" type="button">저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ─── 외부 라이브러리 ─── -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- ─── 앱 진입점 (ES Module) ─── -->
  <script type="module" src="js/main.js?v=20260310b"></script>

  <!-- ─── 테마 토글 로직 ─── -->
  <script>
    (function() {
      const btn = document.getElementById('theme-toggle');
      const moon = document.getElementById('theme-icon-moon');
      const sun = document.getElementById('theme-icon-sun');
      const html = document.documentElement;

      function applyTheme(theme) {
        if (theme === 'light') {
          html.setAttribute('data-theme', 'light');
          moon.style.display = 'none';
          sun.style.display = 'block';
        } else {
          html.removeAttribute('data-theme');
          moon.style.display = 'block';
          sun.style.display = 'none';
        }
      }

      // 초기 아이콘 동기화
      applyTheme(localStorage.getItem('theme') || 'dark');

      btn.addEventListener('click', function() {
        const current = html.getAttribute('data-theme');
        const next = current === 'light' ? 'dark' : 'light';
        localStorage.setItem('theme', next);
        applyTheme(next);
      });

      btn.addEventListener('mouseenter', function() {
        btn.style.background = 'var(--bg-tertiary)';
        btn.style.color = 'var(--text-primary)';
      });
      btn.addEventListener('mouseleave', function() {
        btn.style.background = 'none';
        btn.style.color = 'var(--text-secondary)';
      });
    })();
  </script>

  <!-- ─── Service Worker 등록 + 업데이트 알림 ─── -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});

        // 새 SW 활성화 시 업데이트 토스트 표시
        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data?.type !== 'SW_UPDATED') return;
          let container = document.getElementById('toast-container');
          if (!container) {
            container = document.createElement('div');
            container.id = 'toast-container';
            document.body.appendChild(container);
          }
          const toast = document.createElement('div');
          toast.className = 'toast info';
          toast.style.cssText = 'display:flex;align-items:center;gap:10px;max-width:320px;pointer-events:all';
          toast.innerHTML =
            '<span>앱이 최신 버전으로 업데이트되었습니다.</span>' +
            '<button onclick="location.reload()" style="background:var(--accent-blue);color:#fff;border:none;' +
            'border-radius:6px;padding:4px 10px;font-size:0.78rem;cursor:pointer;flex-shrink:0">새로고침</button>';
          container.appendChild(toast);
          // 30초 후 자동 제거
          setTimeout(() => toast.remove(), 30000);
        });
      });
    }
  </script>
</body>
</html>
